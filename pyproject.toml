[project]
name = "coverpay"
version = "0.1.0"
description = "Defensive fraud-intelligence platform for an Indian payment gateway"
requires-python = ">=3.11"
dependencies = [
    "pandas",
    "numpy",
    "scikit-learn",
    "xgboost",
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "pydantic-settings",
    "sqlalchemy",
    "python-dotenv",
]

[project.optional-dependencies]
dev = ["pytest", "httpx"]

[tool.setuptools.packages.find]
include = ["ml*", "backend*", "fraud_engine*", "simulator*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
