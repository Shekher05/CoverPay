[project]
name = "coverpay"
version = "0.1.0"
description = "Defensive fraud-intelligence platform for an Indian payment gateway"
requires-python = ">=3.11"
dependencies = [
    "pandas",
    "numpy",
    "scikit-learn",
    "xgboost",
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "pydantic-settings",
    "sqlalchemy",
    "python-dotenv",
    "google-genai",
    "python-multipart",
]

[project.optional-dependencies]
dev = ["pytest", "httpx", "ruff", "mypy", "bandit"]

[tool.setuptools]
py-modules = ["config"]

[tool.setuptools.packages.find]
include = ["api*", "ml*", "fraud_engine*", "simulator*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 90
target-version = "py311"

[tool.ruff.lint]
# Pragmatic core: real bugs and dead code, not whitespace religion.
select = ["E", "F", "W", "B", "UP", "I", "SIM"]
ignore = [
    "E501",  # long lines are mostly prose in report strings
    "B008",  # Depends()/File()/Query() in defaults is the FastAPI idiom
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
